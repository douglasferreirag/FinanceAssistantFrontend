<div class="assistant-layout">
  <!-- Header -->
  <header class="site-header">
    <nav class="navbar">
      <div class="logo">Assistente Financeiro</div>
      <ul class="nav-links">
        <!-- Botão Salvar -->
        <li class="nav-item">
          <button class="nav-link" type="submit" form="expenseForm">Salvar</button>
        </li>
        <!-- Botão Limpar -->
        <li class="nav-item">
          <button class="nav-link" type="button" (click)="expenseForm.resetForm()">Limpar</button>
        </li>
        <!-- Botão Home -->
        <li class="nav-item">
          <button class="nav-link" type="button" (click)="navigation.goTo('')">Página Inicial</button>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Body -->
  <main class="site-body">
    <div class="expense-form container mt-5 content">
      <div class="card shadow-sm">
        <div class="card-header">
          <h3 class="mb-0">Cadastrar Gasto</h3>
        </div>
        <div class="card-body">
          <form #expenseForm="ngForm" (ngSubmit)="onSubmit()" id="expenseForm">
            <div class="mb-3 input-group">
              <label for="description" class="form-label">Descrição</label>
              <input id="description" [(ngModel)]="expense.description" name="description" class="form-control" required>
            </div>

            <div class="mb-3 input-group">
              <label for="cost" class="form-label">Valor</label>
              <input id="cost" type="number" [(ngModel)]="expense.cost" name="cost" class="form-control" required>
            </div>

            <div class="mb-3 input-group">
              <label for="expenseDate" class="form-label">Data</label>
              <input id="expenseDate" type="date" [(ngModel)]="expense.expenseDate" name="expenseDate" class="form-control" required>
            </div>

            <div class="mb-3 input-group">
              <label for="category" class="form-label">Categoria</label>
              <input id="category" [(ngModel)]="expense.category.name" name="category" class="form-control" required>
            </div>


          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    © 2026 Assistente Financeiro - Todos os direitos reservados.
  </footer>
</div>
