<div class="assistant-layout">
  <!-- Header -->
  <header class="site-header">
    <nav class="navbar">
      <div class="logo">Assistente Financeiro</div>
      <ul class="nav-links">
        <li class="nav-item">
          <button class="nav-link" type="submit" form="expenseForm">💾 Save</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" type="button" (click)="expenseForm.resetForm()">🧹 Clear</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" type="button" (click)="navigation.goTo('')">🏠 Home</button>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Body -->
  <main class="site-body">
    <section class="content">
      <div class="form-container">
        <h2 class="form-title">💸 Register Expense</h2>

        <form #expenseForm="ngForm" (ngSubmit)="onSubmit()" id="expenseForm" class="form-body">
          <div class="form-group">
            <label for="description" class="form-label">Description</label>
            <input id="description" [(ngModel)]="expense.description" name="description" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="cost" class="form-label">Value</label>
            <input id="cost" type="number" [(ngModel)]="expense.cost" name="cost" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="expenseDate" class="form-label">Date</label>
            <input id="expenseDate" type="date" [(ngModel)]="expense.expenseDate" name="expenseDate" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="category" class="form-label">Category</label>
            <input id="category" [(ngModel)]="expense.category.name" name="category" class="form-control" required>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    © 2026 Assistente Financeiro - All rights reserved.
  </footer>
</div>
