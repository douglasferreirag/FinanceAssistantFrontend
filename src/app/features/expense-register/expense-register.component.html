<app-expense-register-header
  [canSubmit]="!!body.expenseForm?.valid"
  (save)="onSubmit(body.expenseForm)"
  (clear)="onClear()"
  (home)="goHome()"
  (importCategories)="onImportCategories()">
</app-expense-register-header>

<app-expense-register-body
  #body
  [expense]="expense"
  [categoriesName]="categoriesName"
  (categorySelected)="onCategorySelected($event)"
  (submitExpense)="onSubmit($event)"
  (clearExpense)="onClear()">
</app-expense-register-body>

<app-footer></app-footer>
