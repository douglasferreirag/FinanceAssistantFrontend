<main class="site-body">
  <section class="content">
    <div class="analysis-layout">
      <aside class="form-aside">
        <mat-card class="form-container">
          <mat-card-header>
            <mat-card-title>🗒️ Lista Geral de Gastos</mat-card-title>
          </mat-card-header>

          <mat-card-content>
            <table mat-table [dataSource]="expenses" class="mat-elevation-z2">

              <!-- Descrição -->
              <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef> Descrição </th>
                <td mat-cell *matCellDef="let e"> {{ e.description }} </td>
              </ng-container>

              <!-- Data -->
              <ng-container matColumnDef="expenseDate">
                <th mat-header-cell *matHeaderCellDef> Data </th>
                <td mat-cell *matCellDef="let e"> {{ e.expenseDate | date:'dd/MM/yyyy' }} </td>
              </ng-container>

              <!-- Valor -->
              <ng-container matColumnDef="cost">
                <th mat-header-cell *matHeaderCellDef> Valor </th>
                <td mat-cell *matCellDef="let e"> {{ e.cost | currency:'BRL' }} </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
          </mat-card-content>
        </mat-card>
      </aside>
    </div>
  </section>
</main>
