<main class="site-body">
  <section class="content">
    <div class="analysis-layout">
      <aside class="form-aside">
        <div class="form-container">
          <h2 class="goal-title">🗒️ Lista Geral de Categorias</h2>

          <div class="form-body">
            <table class="table">
              <thead class="table-head">
                <tr class="table-row table-row-head">
                  <!-- Cabeçalho alinhado igual às células -->
                  <th class="table-cell table-cell-head table-cell-name">Nome</th>

                </tr>
              </thead>
              <tbody class="table-body">
                <tr *ngFor="let c of categories" class="table-row">
                      <td class="table-cell table-cell-name">{{ c.name }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>
