<div class="form-container">
  <h2 class="form-title">💸 Cadastro de gastos</h2>

  <form #expenseForm="ngForm" (ngSubmit)="onSubmit(expenseForm)" id="expenseForm" class="form-body">
    <div class="form-group">
      <label for="description" class="form-label">Description</label>
      <input id="description" [(ngModel)]="expense.description" name="description" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="cost" class="form-label">Value</label>
      <input id="cost" type="number" [(ngModel)]="expense.cost" name="cost" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="expenseDate" class="form-label">Date</label>
      <input id="expenseDate" type="date" [(ngModel)]="expense.expenseDate" name="expenseDate" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="category" class="form-label">Category</label>
      <input id="category" [(ngModel)]="expense.category.name" name="category" class="form-control" required>
    </div>


  </form>
</div>
