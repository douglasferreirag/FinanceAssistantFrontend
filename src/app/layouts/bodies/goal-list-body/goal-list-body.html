<main class="site-body">
  <section class="content">
    <div class="analysis-layout">
      <aside class="form-aside">
        <mat-card class="form-container">
          <mat-card-header>
            <mat-card-title>🗒️ Lista Geral de Metas</mat-card-title>
          </mat-card-header>

          <mat-card-content>
            <table mat-table [dataSource]="goals" class="mat-elevation-z2">

              <!-- Descrição (Mês) -->
              <ng-container matColumnDef="month">
                <th mat-header-cell *matHeaderCellDef> Mês </th>
                <td mat-cell *matCellDef="let g"> {{ g.month }} </td>
              </ng-container>

              <!-- Ano -->
              <ng-container matColumnDef="year">
                <th mat-header-cell *matHeaderCellDef> Ano </th>
                <td mat-cell *matCellDef="let g"> {{ g.year }} </td>
              </ng-container>

              <!-- Valor (Meta) -->
              <ng-container matColumnDef="ceiling">
                <th mat-header-cell *matHeaderCellDef> Valor </th>
                <td mat-cell *matCellDef="let g"> {{ g.ceiling | currency:'BRL' }} </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
          </mat-card-content>
        </mat-card>
      </aside>
    </div>
  </section>
</main>
