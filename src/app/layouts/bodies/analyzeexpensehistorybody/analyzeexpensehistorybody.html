<main class="site-body">
  <section class="content">
    <div class="chatbot-card">
      <h2>Análise Inteligente de Gastos</h2>

      <!-- Janela de chat -->
      <div class="chat-window">
        <div *ngFor="let msg of messages" class="chat-message" [ngClass]="msg.sender">
          <p>{{ msg.text }}</p>
        </div>
      </div>

    </div>
  </section>
</main>
