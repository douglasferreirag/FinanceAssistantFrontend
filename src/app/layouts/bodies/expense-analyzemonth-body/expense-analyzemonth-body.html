<main class="site-body">
  <section class="content">
    <div class="analysis-layout">

      <!-- Formulário em card -->
      <mat-card class="form-card">
        <mat-card-header>
          <mat-card-title>Selecionar Período</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <form (ngSubmit)="onSubmit()" #periodForm="ngForm" class="form-body">

            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Mês</mat-label>
              <mat-select [(ngModel)]="month" name="month" required>
                <mat-option *ngFor="let m of months" [value]="m.value">
                  {{ m.label }}
                </mat-option>
              </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
              <mat-label>Ano</mat-label>
              <input matInput type="number" [(ngModel)]="year" name="year" required>
            </mat-form-field>

            <button mat-raised-button color="primary" type="submit">
              Confirmar Período
            </button>
          </form>
        </mat-card-content>
      </mat-card>

      <!-- Resultados em card -->
      <mat-card class="results-card">
        <mat-card-header>
          <mat-card-title>Resultados</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Meta</mat-label>
            <input matInput [value]="goal ?? ''" readonly>
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Total de Gastos</mat-label>
            <input matInput [value]="total ?? ''" readonly>
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Avaliação</mat-label>
            <input matInput [value]="result ?? ''" readonly>
          </mat-form-field>
        </mat-card-content>
      </mat-card>

    </div>
  </section>
</main>
