<main class="site-body">
  <section class="content">
    <mat-card class="chatbot-card">
      <mat-card-header>
        <mat-card-title>🤖 Análise Inteligente de Gastos</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <!-- Janela de chat -->
        <div class="chat-window">
          <div *ngFor="let msg of messages" class="chat-message" [ngClass]="msg.sender">
            <p>{{ msg.text }}</p>
          </div>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <mat-form-field appearance="outline" class="chat-input">">
        </mat-form-field>
      </mat-card-actions>
    </mat-card>
  </section>
</main>
