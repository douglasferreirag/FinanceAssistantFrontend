<mat-card class="form-container">
  <mat-card-header>
    <mat-card-title>💸 Cadastro de Metas</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form (ngSubmit)="onSubmit(goalForm)" #goalForm="ngForm" id="goalForm" class="form-body">

      <!-- Mês -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Mês</mat-label>
        <input matInput type="number" [(ngModel)]="goal.month" name="month" placeholder="Digite o mês" required>
      </mat-form-field>

      <!-- Ano -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Ano</mat-label>
        <input matInput type="number" [(ngModel)]="goal.year" name="year" placeholder="Digite o ano" required>
      </mat-form-field>

      <!-- Valor limite -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Valor limite</mat-label>
        <input matInput type="number" [(ngModel)]="goal.ceiling" name="ceiling" placeholder="Digite o limite de gastos" required>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">
        Salvar Meta
      </button>
    </form>
  </mat-card-content>
</mat-card>
