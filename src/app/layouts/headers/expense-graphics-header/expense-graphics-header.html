<mat-toolbar color="primary" class="site-header">
  <span class="logo">Assistente Financeiro</span>
  <span class="spacer"></span>

  <button mat-button (click)="goHome.emit()">
    🏠 Página inicial
  </button>

  <button mat-raised-button color="accent" (click)="generateGraphic.emit('bar')">
    Gráfico de barras
  </button>

  <button mat-raised-button color="accent" (click)="generateGraphic.emit('line')">
    Gráfico de linhas
  </button>

  <button mat-raised-button color="accent" (click)="generateGraphic.emit('pie')">
    📋 Gráfico de pizza
  </button>

  <button mat-raised-button color="accent" (click)="generateGraphic.emit('doughnut')">
    📋 Gráfico de rosca
  </button>

  <button mat-raised-button color="accent" (click)="generateGraphic.emit('radar')">
    📋 Gráfico de radar
  </button>
</mat-toolbar>
